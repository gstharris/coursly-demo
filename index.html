<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Order</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #2D4A3E;
      --brand-light: #4A7A68;
      --accent:      #C9A84C;
      --bg:          #0F0F0F;
      --surface:     #1A1A1A;
      --surface2:    #242424;
      --border:      #2E2E2E;
      --text:        #F0EDE8;
      --text-muted:  #888;
      --red:         #E05252;
      --radius:      12px;
      --radius-sm:   8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .header-left p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .cart-btn {
      position: relative;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .cart-btn:disabled { opacity: 0.4; cursor: default; }

    .cart-badge {
      background: #000;
      color: var(--accent);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main { flex: 1; padding-bottom: 100px; }

    .section-nav {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 57px;
      z-index: 90;
      background: var(--bg);
    }

    .section-nav::-webkit-scrollbar { display: none; }

    .section-tab {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 50px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .section-tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .menu-section { padding: 20px 16px 8px; }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .menu-item:active { border-color: var(--accent); }
    .item-info { flex: 1; }

    .item-name {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .item-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
    }

    .item-tag {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .item-tag.spicy { background: #3D1A1A; color: #E05252; }
    .item-tag.veg   { background: #1A3D1A; color: #52E052; }
    .item-tag.sig   { background: #3D3D1A; color: var(--accent); }

    .item-add-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brand);
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      transition: background 0.15s;
    }

    .item-add-btn:active { background: var(--brand-light); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px 16px 40px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
    }

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .modal-price {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .modifier-group { margin-bottom: 20px; }

    .modifier-group-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .required-badge {
      background: var(--red);
      color: #fff;
      font-size: 0.6rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .modifier-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface2);
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .modifier-option.selected { border-color: var(--brand-light); }
    .modifier-option-name { font-size: 0.9rem; }
    .modifier-option-price { font-size: 0.8rem; color: var(--accent); }

    .special-requests { margin-top: 16px; }

    .special-requests label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    .special-requests textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      padding: 10px 12px;
      resize: none;
      height: 80px;
      font-family: inherit;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: var(--radius);
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 16px;
    }

    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-primary  { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--surface2); color: var(--text); }
    .btn-danger   { background: var(--red); color: #fff; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-name { font-size: 0.9rem; font-weight: 600; }

    .cart-item-mods {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cart-item-price {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
      margin-left: 12px;
    }

    .cart-item-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0 0 8px;
    }

    .cart-totals { padding: 16px 0 0; }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .cart-total-row.total {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 6px;
    }

    .phone-screen {
      padding: 32px 16px;
      max-width: 380px;
      margin: 0 auto;
    }

    .phone-screen h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .phone-screen p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.1rem;
      padding: 14px 16px;
      font-family: inherit;
      letter-spacing: 0.05em;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--brand-light);
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 24px 0;
    }

    .otp-digit {
      width: 46px;
      height: 56px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
    }

    .otp-digit:focus {
      outline: none;
      border-color: var(--brand-light);
    }

    .confirmation {
      text-align: center;
      padding: 48px 16px;
    }

    .confirmation-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .confirmation h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .confirmation p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 20px;
      font-size: 0.85rem;
      z-index: 500;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--red); color: var(--red); }

    .loading {
      text-align: center;
      padding: 64px 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .notice {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      margin: 16px;
      font-size: 0.85rem;
    }

    .notice strong { color: var(--accent); }

    .ing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }

    .ing-name { font-size: 0.9rem; }

    .ing-btns { display: flex; gap: 6px; }

    .ing-btn {
      padding: 4px 10px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--border);
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
    }

    .ing-btn.active-keep   { background: var(--brand);  color: #fff; }
    .ing-btn.active-remove { background: var(--red);    color: #fff; }
    .ing-btn.active-side   { background: var(--accent); color: #000; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <h1 id="restaurant-name">Loading...</h1>
      <p id="table-name"></p>
    </div>
    <button class="cart-btn" id="cart-btn" disabled>
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
  </header>

  <main id="main">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading menu...</p>
    </div>
  </main>
</div>

<!-- Item detail modal -->
<div class="modal-overlay" id="item-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="item-modal-content"></div>
  </div>
</div>

<!-- Cart modal -->
<div class="modal-overlay" id="cart-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="cart-modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────

const params        = new URLSearchParams(window.location.search);
const RESTAURANT_ID = parseInt(params.get('restaurantId'));
const TABLE_ID      = parseInt(params.get('tableId'));
const API           = '';

let state = {
  restaurant: null,
  menu: [],
  cart: [],
  session: null,
  pendingPhone: null,
  pendingTabId: null,
};

// ─── Helpers ──────────────────────────────────────────────────────────────────

function cents(c) {
  return '$' + (c / 100).toFixed(2);
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => el.className = 'toast', 3000);
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.errors?.[0] ?? 'Something went wrong');
  return data;
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ─── Cart helpers ─────────────────────────────────────────────────────────────

function cartTotal() {
  return state.cart.reduce((sum, entry) => {
    const mods = entry.selectedMods.reduce((s, m) => s + m.priceAdjustmentCents, 0);
    return sum + (entry.item.priceCents + mods) * entry.quantity;
  }, 0);
}

function updateCartBtn() {
  const count = state.cart.reduce((s, e) => s + e.quantity, 0);
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-btn').disabled = count === 0;
}

// ─── Load menu ────────────────────────────────────────────────────────────────

async function loadMenu() {
  try {
    const menuData = await api(`/api/qr/menu?restaurantId=${RESTAURANT_ID}`);
    state.menu = menuData.sections;
    document.getElementById('restaurant-name').textContent = 'Decker Commissary';
    document.getElementById('table-name').textContent =
      `Table ${TABLE_ID} · ${menuData.currentPeriod}`;
    renderMenu();
  } catch (err) {
    document.getElementById('main').innerHTML =
      `<div class="loading"><p style="color:var(--red)">${err.message}</p></div>`;
  }
}

// ─── Render menu ──────────────────────────────────────────────────────────────

function renderMenu() {
  const main = document.getElementById('main');

  const navHTML = state.menu.map((section, i) => `
    <button class="section-tab ${i === 0 ? 'active' : ''}"
      onclick="scrollToSection('section-${section.id}', this)">
      ${section.emoji ?? ''} ${section.name}
    </button>
  `).join('');

  const sectionsHTML = state.menu.map(section => `
    <div class="menu-section" id="section-${section.id}">
      <div class="section-title">${section.emoji ?? ''} ${section.name}</div>
      ${section.items.map(item => renderMenuItem(item)).join('')}
    </div>
  `).join('');

  main.innerHTML = `<div class="section-nav">${navHTML}</div>${sectionsHTML}`;
  document.getElementById('cart-btn').addEventListener('click', openCart);
}

function renderMenuItem(item) {
  const tags = [];
  if (item.isSpicy)             tags.push('<span class="item-tag spicy">🌶 Spicy</span>');
  if (item.tags?.includes('veg')) tags.push('<span class="item-tag veg">🌿 Veg</span>');
  if (item.tags?.includes('sig')) tags.push('<span class="item-tag sig">⭐ Signature</span>');
  if (item.tags?.includes('gf')) tags.push('<span class="item-tag">GF</span>');

  return `
    <div class="menu-item" onclick="openItem(${item.id})">
      <div class="item-info">
        <div class="item-name">${item.emoji ?? ''} ${item.name}</div>
        ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
        <div class="item-meta">
          <span class="item-price">${cents(item.priceCents)}</span>
          ${tags.join('')}
        </div>
      </div>
      <button class="item-add-btn"
        onclick="event.stopPropagation(); openItem(${item.id})">+</button>
    </div>`;
}

function scrollToSection(id, btn) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

// ─── Item modal ───────────────────────────────────────────────────────────────

// FIX 1: ingredientInstructions added to initial state
let currentItemState = {
  item: null,
  selectedMods: {},
  ingredientInstructions: {},
  specialRequests: '',
};

function openItem(itemId) {
  const item = state.menu.flatMap(s => s.items).find(i => i.id === itemId);
  if (!item) return;

  // FIX 1: reset includes ingredientInstructions
  currentItemState = {
    item,
    selectedMods: {},
    ingredientInstructions: {},
    specialRequests: '',
  };

  // Pre-select first option for required radio groups
  item.modifierGroups.forEach(group => {
    if (group.isRequired && group.type === 'radio' && group.options.length > 0) {
      currentItemState.selectedMods[group.id] = [group.options[0]];
    }
  });

  renderItemModal(item);
  openModal('item-modal');
}

function renderItemModal(item) {
  const groupsHTML = item.modifierGroups.map(group => `
    <div class="modifier-group">
      <div class="modifier-group-label">
        ${group.label}
        ${group.isRequired ? '<span class="required-badge">Required</span>' : ''}
      </div>
      ${group.options.map(opt => {
        const selected = (currentItemState.selectedMods[group.id] ?? [])
          .some(m => m.id === opt.id);
        return `
          <div class="modifier-option ${selected ? 'selected' : ''}"
            onclick="toggleModifier(${group.id}, ${opt.id}, '${group.type}', ${group.isRequired})">
            <span class="modifier-option-name">${opt.name}</span>
            ${opt.priceAdjustmentCents !== 0
              ? `<span class="modifier-option-price">+${cents(opt.priceAdjustmentCents)}</span>`
              : ''}
          </div>`;
      }).join('')}
    </div>
  `).join('');

  // FIX 2: ingredient rows rendered with CSS classes instead of inline styles
  const ingredientsHTML = item.ingredients?.length > 0 ? `
    <div class="modifier-group">
      <div class="modifier-group-label">Modifications</div>
      ${item.ingredients.map(ing => {
        const instruction = currentItemState.ingredientInstructions[ing.id] ?? 'kept';
        return `
          <div class="ing-row">
            <span class="ing-name">${ing.name}</span>
            <div class="ing-btns">
              <button class="ing-btn ${instruction === 'kept' ? 'active-keep' : ''}"
                onclick="setIngredient(${ing.id}, 'kept')">Keep</button>
              <button class="ing-btn ${instruction === 'removed' ? 'active-remove' : ''}"
                onclick="setIngredient(${ing.id}, 'removed')">Remove</button>
              ${ing.canBeSideOrder ? `
              <button class="ing-btn ${instruction === 'side' ? 'active-side' : ''}"
                onclick="setIngredient(${ing.id}, 'side')">Side</button>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>` : '';

  document.getElementById('item-modal-content').innerHTML = `
    <div class="modal-title">${item.emoji ?? ''} ${item.name}</div>
    <div class="modal-price">${cents(item.priceCents)}</div>
    ${item.description
      ? `<p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px">${item.description}</p>`
      : ''}
    ${groupsHTML}
    ${ingredientsHTML}
    <div class="special-requests">
      <label>Special requests (optional)</label>
      <textarea class="input-field"
        placeholder="e.g. no onions, dressing on the side..."
        oninput="currentItemState.specialRequests = this.value"></textarea>
    </div>
    <button class="btn btn-primary" onclick="addToCart()">Add to Order</button>
    <button class="btn btn-secondary" onclick="closeModal('item-modal')">Cancel</button>
  `;
}

function toggleModifier(groupId, optId, type, isRequired) {
  const current = currentItemState.selectedMods[groupId] ?? [];
  const group = currentItemState.item.modifierGroups.find(g => g.id === groupId);
  const opt = group?.options.find(o => o.id === optId);
  if (!opt) return;

  if (type === 'radio') {
    currentItemState.selectedMods[groupId] = [opt];
  } else {
    const idx = current.findIndex(m => m.id === optId);
    if (idx >= 0) {
      if (isRequired && current.length === 1) return;
      currentItemState.selectedMods[groupId] = current.filter(m => m.id !== optId);
    } else {
      currentItemState.selectedMods[groupId] = [...current, opt];
    }
  }
  renderItemModal(currentItemState.item);
}

// FIX 2: setIngredient function added
function setIngredient(ingredientId, instruction) {
  currentItemState.ingredientInstructions[ingredientId] = instruction;
  renderItemModal(currentItemState.item);
}

function addToCart() {
  const { item, selectedMods, specialRequests, ingredientInstructions } = currentItemState;

  // Validate required groups
  for (const group of item.modifierGroups) {
    if (group.isRequired && !(selectedMods[group.id]?.length > 0)) {
      toast(`Please select ${group.label}`, true);
      return;
    }
  }

  const allMods = Object.values(selectedMods).flat();

  // FIX 3: ingredientInstructions saved to cart entry
  state.cart.push({
    item,
    selectedMods: allMods,
    ingredientInstructions,
    specialRequests,
    quantity: 1,
  });

  updateCartBtn();
  closeModal('item-modal');
  toast(`${item.name} added to cart`);
}

// ─── Cart modal ───────────────────────────────────────────────────────────────

function openCart() {
  renderCartModal();
  openModal('cart-modal');
}

function renderCartModal() {
  const subtotal = cartTotal();
  const tax = Math.round(subtotal * 0.095);
  const total = subtotal + tax;

  const itemsHTML = state.cart.map((entry, idx) => {
    const modNames = entry.selectedMods.map(m => m.name);
    const removedIngs = Object.entries(entry.ingredientInstructions ?? {})
      .filter(([, v]) => v === 'removed')
      .map(([id]) => {
        const ing = entry.item.ingredients?.find(i => i.id === parseInt(id));
        return ing ? `No ${ing.name}` : null;
      })
      .filter(Boolean);
    const sideIngs = Object.entries(entry.ingredientInstructions ?? {})
      .filter(([, v]) => v === 'side')
      .map(([id]) => {
        const ing = entry.item.ingredients?.find(i => i.id === parseInt(id));
        return ing ? `${ing.name} on side` : null;
      })
      .filter(Boolean);
    const allNotes = [...modNames, ...removedIngs, ...sideIngs];

    return `
      <div class="cart-item">
        <div>
          <div class="cart-item-name">${entry.item.name}</div>
          ${allNotes.length > 0
            ? `<div class="cart-item-mods">${allNotes.join(', ')}</div>`
            : ''}
          ${entry.specialRequests
            ? `<div class="cart-item-mods">Note: ${entry.specialRequests}</div>`
            : ''}
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span class="cart-item-price">${cents(
            (entry.item.priceCents +
              entry.selectedMods.reduce((s, m) => s + m.priceAdjustmentCents, 0)
            ) * entry.quantity
          )}</span>
          <button class="cart-item-remove" onclick="removeFromCart(${idx})">✕</button>
        </div>
      </div>`;
  }).join('');

  document.getElementById('cart-modal-content').innerHTML = `
    <div class="modal-title">Your Order</div>
    ${itemsHTML}
    <div class="cart-totals">
      <div class="cart-total-row"><span>Subtotal</span><span>${cents(subtotal)}</span></div>
      <div class="cart-total-row"><span>Tax (9.5%)</span><span>${cents(tax)}</span></div>
      <div class="cart-total-row total"><span>Total</span><span>${cents(total)}</span></div>
    </div>
    <button class="btn btn-primary" onclick="startCheckout()">Place Order →</button>
    <button class="btn btn-secondary" onclick="closeModal('cart-modal')">Keep Browsing</button>
  `;
}

function removeFromCart(idx) {
  state.cart.splice(idx, 1);
  updateCartBtn();
  if (state.cart.length === 0) closeModal('cart-modal');
  else renderCartModal();
}

// ─── Checkout ─────────────────────────────────────────────────────────────────

function startCheckout() {
  closeModal('cart-modal');
  showPhoneScreen();
}

function showPhoneScreen() {
  document.getElementById('main').innerHTML = `
    <div class="phone-screen">
      <h2>Almost there!</h2>
      <p>Enter your phone number to place your order. We'll use this to keep track of your tab.</p>
      <input class="input-field" type="tel" id="phone-input"
        placeholder="(805) 555-1234" maxlength="14"
        oninput="formatPhone(this)" />
      <button class="btn btn-primary" onclick="submitPhone()">Continue →</button>
      <button class="btn btn-secondary" onclick="renderMenu()">← Back to Menu</button>
    </div>`;
  document.getElementById('phone-input').focus();
}

function formatPhone(input) {
  let v = input.value.replace(/\D/g, '').substring(0, 10);
  if (v.length >= 6)      v = '(' + v.substring(0,3) + ') ' + v.substring(3,6) + '-' + v.substring(6);
  else if (v.length >= 3) v = '(' + v.substring(0,3) + ') ' + v.substring(3);
  input.value = v;
}

async function submitPhone() {
  const phone = document.getElementById('phone-input').value;
  const digits = phone.replace(/\D/g, '');
  if (digits.length < 10) { toast('Please enter a valid phone number', true); return; }

  try {
    const data = await api('/api/qr/session', {
      method: 'POST',
      body: JSON.stringify({ restaurantId: RESTAURANT_ID, tableId: TABLE_ID, phone }),
    });

    if (data.status === 'otp_required') {
      state.pendingPhone = digits;
      state.pendingTabId = data.tabId;
      showOTPScreen(digits);
      return;
    }

    if (data.tab.tableId !== TABLE_ID) {
      showCrossTableNotice(data);
      return;
    }

    state.session = data;
    await placeOrder();
  } catch (err) {
    toast(err.message, true);
  }
}

// ─── OTP ──────────────────────────────────────────────────────────────────────

function showOTPScreen(phone) {
  document.getElementById('main').innerHTML = `
    <div class="phone-screen">
      <h2>Check your texts</h2>
      <p>We sent a 6-digit code to ${phone.replace(/(\d{3})(\d{3})(\d{4})/, '($1) $2-$3')}.</p>
      <div class="otp-inputs">
        ${[0,1,2,3,4,5].map(i => `
          <input class="otp-digit" type="number" maxlength="1" id="otp-${i}"
            oninput="otpInput(this, ${i})"
            onkeydown="otpBack(this, ${i}, event)" />`).join('')}
      </div>
      <button class="btn btn-primary" onclick="submitOTP()">Verify →</button>
      <button class="btn btn-secondary" onclick="showPhoneScreen()">← Change number</button>
    </div>`;
  document.getElementById('otp-0').focus();
}

function otpInput(el, idx) {
  el.value = el.value.slice(-1);
  if (el.value && idx < 5) document.getElementById(`otp-${idx+1}`).focus();
  if (idx === 5 && el.value) submitOTP();
}

function otpBack(el, idx, e) {
  if (e.key === 'Backspace' && !el.value && idx > 0)
    document.getElementById(`otp-${idx-1}`).focus();
}

async function submitOTP() {
  const code = [0,1,2,3,4,5]
    .map(i => document.getElementById(`otp-${i}`)?.value ?? '').join('');
  if (code.length < 6) { toast('Please enter the full 6-digit code', true); return; }

  try {
    const data = await api('/api/qr/verify', {
      method: 'POST',
      body: JSON.stringify({
        restaurantId: RESTAURANT_ID,
        tableId: TABLE_ID,
        phone: state.pendingPhone,
        code,
      }),
    });
    state.session = data;
    await placeOrder();
  } catch (err) {
    toast(err.message, true);
  }
}

// ─── Cross-table ──────────────────────────────────────────────────────────────

function showCrossTableNotice(data) {
  const tableName = data.tab.table?.name ?? 'another table';
  document.getElementById('main').innerHTML = `
    <div class="phone-screen">
      <div class="notice">
        <strong>You have an open order at ${tableName}.</strong>
        <p style="margin-top:6px">Add to that order (delivered there) or start fresh here?</p>
      </div>
      <button class="btn btn-primary" onclick='continueExistingTab(${JSON.stringify(data)})'>
        Add to my order at ${tableName}
      </button>
      <button class="btn btn-secondary" onclick="startFreshTab()">
        Start fresh at this table
      </button>
    </div>`;
}

async function continueExistingTab(data) {
  state.session = data;
  await placeOrder();
}

async function startFreshTab() {
  try {
    const data = await api('/api/tabs', {
      method: 'POST',
      body: JSON.stringify({ restaurantId: RESTAURANT_ID, tableId: TABLE_ID }),
    });
    state.session = { ...state.session, tab: data.tab };
    await placeOrder();
  } catch (err) {
    toast(err.message, true);
  }
}

// ─── Place order ──────────────────────────────────────────────────────────────

async function placeOrder() {
  const { tab } = state.session;

  const items = state.cart.map(entry => ({
    menuItemId: entry.item.id,
    quantity: entry.quantity,
    specialRequests: entry.specialRequests || undefined,
    modifiers: entry.selectedMods.map(m => ({
      modifierGroupId: m.modifierGroupId,
      modifierOptionId: m.id,
    })),
  }));

  try {
    await api('/api/orders', {
      method: 'POST',
      body: JSON.stringify({
        restaurantId: RESTAURANT_ID,
        tabId: tab.id,
        tableId: tab.tableId,
        diningOption: 'dine_in',
        items,
      }),
    });

    state.cart = [];
    updateCartBtn();
    showConfirmation();
  } catch (err) {
    toast(err.message, true);
    renderMenu();
  }
}

// ─── Confirmation ─────────────────────────────────────────────────────────────

function showConfirmation() {
  document.getElementById('main').innerHTML = `
    <div class="confirmation">
      <div class="confirmation-icon">🍽️</div>
      <h2>Order placed!</h2>
      <p>Your order is on its way to the kitchen.<br>We'll take care of the rest.</p>
      <button class="btn btn-primary" style="max-width:280px;margin:0 auto"
        onclick="renderMenu()">Add More Items</button>
      <button class="btn btn-secondary" style="max-width:280px;margin:16px auto 0"
        onclick="showPayScreen()">Pay Now</button>
    </div>`;
}

// ─── Pay ──────────────────────────────────────────────────────────────────────

function showPayScreen() {
  document.getElementById('main').innerHTML = `
    <div class="phone-screen">
      <h2>Pay your tab</h2>
      <p>We'll authorize your card now and charge when you're ready to close out.</p>
      <div id="tip-section" style="margin-bottom:20px">
        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:10px">Add a tip?</p>
        <div style="display:flex;gap:8px">
          ${[0, 18, 20, 22].map(pct => `
            <button class="section-tab" onclick="selectTip(${pct}, this)">
              ${pct === 0 ? 'No tip' : pct + '%'}
            </button>`).join('')}
        </div>
      </div>
      <div id="pay-summary"></div>
      <button class="btn btn-primary" onclick="authorizePayment()">Authorize Card →</button>
      <button class="btn btn-secondary" onclick="renderMenu()">← Keep my tab open</button>
    </div>`;
  selectTip(20, document.querySelectorAll('#tip-section .section-tab')[2]);
}

let selectedTipPct = 20;

function selectTip(pct, btn) {
  selectedTipPct = pct;
  document.querySelectorAll('#tip-section .section-tab')
    .forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const el = document.getElementById('pay-summary');
  if (el) el.innerHTML = `
    <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:16px">
      Tip: ${pct === 0 ? 'None' : pct + '%'} · Your card will be authorized but not charged until you close your tab.
    </p>`;
}

async function authorizePayment() {
  const tabId = state.session?.tab?.id;
  if (!tabId) return;

  try {
    const data = await api('/api/qr/pay', {
      method: 'POST',
      body: JSON.stringify({ restaurantId: RESTAURANT_ID, tabId, tipPct: selectedTipPct }),
    });
    showPaymentForm(data);
  } catch (err) {
    toast(err.message, true);
  }
}

function showPaymentForm(payData) {
  document.getElementById('main').innerHTML = `
    <div class="phone-screen">
      <h2>Complete payment</h2>
      <p style="color:var(--accent);font-size:1.1rem;font-weight:700;margin-bottom:8px">
        Total: ${cents(payData.totalCents)}
      </p>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:24px">
        Subtotal ${cents(payData.subtotalCents)} +
        Tax ${cents(payData.taxCents)} +
        Tip ${cents(payData.tipCents)}
      </p>
      <div id="stripe-element" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px">
        <p style="color:var(--text-muted);font-size:0.85rem;text-align:center">
          Stripe payment form will appear here once configured with your publishable key.
        </p>
      </div>
      <button class="btn btn-secondary" onclick="showPayScreen()">← Back</button>
    </div>`;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────

if (!RESTAURANT_ID || !TABLE_ID) {
  document.getElementById('main').innerHTML = `
    <div class="loading">
      <p style="color:var(--red)">Invalid QR code — missing restaurant or table info.</p>
    </div>`;
} else {
  loadMenu();
}
</script>
</body>
</html>
